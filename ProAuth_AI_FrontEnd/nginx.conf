server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ALB target-group healthcheck — must stay dependency-free (no backend call).
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames under /assets — safe to cache
    # aggressively; a new deploy ships new filenames, not new content at
    # the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself must never be cached, so a fresh deploy is picked
    # up on next load instead of serving a stale shell referencing
    # assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router SPA: any path not matching a real static file falls
    # back to index.html, so client-side routes (e.g. a refresh on
    # /queue) don't 404 at the server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
